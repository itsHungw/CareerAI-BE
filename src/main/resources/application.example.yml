spring:
  application:
    name: CareerAI-Builder
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/careerai}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:yourpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:YOUR_SUPER_SECRET_JWT_KEY_HERE}
  expiration: ${JWT_EXPIRATION:900000} 
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

ai:
  enabled: ${AI_ENABLED:false}
  provider: ${AI_PROVIDER:openai}
  fallback-provider: ${AI_FALLBACK_PROVIDER:mock}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-5-mini}
    temperature: ${OPENAI_TEMPERATURE:0.2}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    temperature: ${GEMINI_TEMPERATURE:0.2}

app:
  cors:
    allowed-origins:
      - http://localhost:3000
  upload-dir: cv-uploads/
