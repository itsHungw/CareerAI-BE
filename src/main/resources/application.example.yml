spring:
  application:
    name: CareerAI-Builder
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/careerai}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:yourpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: ${REDIS_TIMEOUT:2000ms}
    database: 0
  cache:
    type: redis
    redis:
      time-to-live: 600000  # 10 minutes default

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:YOUR_SUPER_SECRET_JWT_KEY_HERE}
  expiration: ${JWT_EXPIRATION:900000} 
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

ai:
  enabled: ${AI_ENABLED:false}
  provider: ${AI_PROVIDER:fpt}
  fallback-provider: ${AI_FALLBACK_PROVIDER:mock}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
  fpt:
    api-key: ${FPT_AI_API_KEY:}
    base-url: ${FPT_AI_BASE_URL:https://mkp-api.fptcloud.com}
    model: ${FPT_CHAT_MODEL:Qwen2.5-7B-instruct}
    embedding-model: ${FPT_EMBEDDING_MODEL:Vietnamese_Embedding}
    temperature: ${FPT_TEMPERATURE:0.2}

app:
  cors:
    allowed-origins:
      - http://localhost:3000
  upload-dir: cv-uploads/
